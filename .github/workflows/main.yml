name: Build Switch runtime

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [renpy7, renpy8]
    env:
      RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v4
      - name: Build with Docker Compose
        run: docker compose run --build --rm build
      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: renpy-switch-${{ matrix.runtime }}
          path: artifacts/
          if-no-files-found: error
